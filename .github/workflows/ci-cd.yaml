name: ci

on:
  push:
    branches:
      - ci/github-actions-pipeline

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Backend: ruff
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      # Frontend: eslint + type-check
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Backend: pytest, DB backed tests excluded
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend unit tests
        working-directory: backend
        run: uv run pytest -m "not integration"

      # Frontend: vitest
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploy
          POSTGRES_PASSWORD: deploy
          POSTGRES_DB: deploy_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deploy -d deploy_pipeline"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values: app.config requires these at import time. Nothing here
      # reaches a real service; the DB is the job's own service container.
      DATABASE_URL: postgresql+asyncpg://deploy:deploy@localhost:5432/deploy_pipeline
      TEST_DATABASE_URL: postgresql+asyncpg://deploy:deploy@localhost:5432/deploy_pipeline_test
      APP_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_JWT_ISSUER: https://placeholder.clerk.accounts.dev
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Apply migrations to a fresh database
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run backend integration tests
        working-directory: backend
        run: uv run pytest -m integration
