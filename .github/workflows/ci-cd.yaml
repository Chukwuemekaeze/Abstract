name: ci

on:
  push:
    branches:
      - ci/github-actions-pipeline

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Backend: ruff
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      # Frontend: eslint + type-check
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Backend: pytest, DB backed tests excluded
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend unit tests
        working-directory: backend
        run: uv run pytest -m "not integration"

      # Frontend: vitest
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploy
          POSTGRES_PASSWORD: deploy
          POSTGRES_DB: deploy_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deploy -d deploy_pipeline"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values: app.config requires these at import time. Nothing here
      # reaches a real service; the DB is the job's own service container.
      DATABASE_URL: postgresql+asyncpg://deploy:deploy@localhost:5432/deploy_pipeline
      TEST_DATABASE_URL: postgresql+asyncpg://deploy:deploy@localhost:5432/deploy_pipeline_test
      APP_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_JWT_ISSUER: https://placeholder.clerk.accounts.dev
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Apply migrations to a fresh database
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run backend integration tests
        working-directory: backend
        run: uv run pytest -m integration

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so the secret scan sees every commit, not just the latest.
          fetch-depth: 0

      # Secrets: gitleaks over the whole git history
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Static analysis: semgrep over backend and frontend source
      - name: Static analysis
        run: >-
          uvx semgrep@1.182.0 scan
          --config p/python --config p/typescript --config p/react
          --metrics=off --error
          backend/app frontend/src

      # Dependencies: every locked package, dev extras included, any severity fails
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit@2.10.1 --strict --require-hashes --disable-pip -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

  build:
    needs: [lint, unit-test, integration-test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/chukwuemekaeze/abstract/backend
      FRONTEND_IMAGE: ghcr.io/chukwuemekaeze/abstract/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend: build, scan, push only if the scan passes
      - name: Backend image tags
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # --ignore-unfixed: the python:3.12-slim (Debian) base carries OS CVEs with
      # no released fix; only findings that have a fix fail the build.
      - name: Scan backend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.76.1 image --exit-code 1 --ignore-unfixed --ignorefile /.trivyignore
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push backend image
        run: docker push --all-tags ${{ env.BACKEND_IMAGE }}

      # Frontend: build, scan, push only if the scan passes
      - name: Frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan frontend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.76.1 image --exit-code 1 --ignorefile /.trivyignore
          ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Push frontend image
        run: docker push --all-tags ${{ env.FRONTEND_IMAGE }}
